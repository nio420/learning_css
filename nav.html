<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  body{
  font-family: "Poppins", sans-serif;
  margin: 0;
}
  #main_menu{
  background: #ffcccc;
}
#main_menu ul{
  margin: 0;
  padding: 0;
  list-style: none;
  text-align: center;
}

#main_menu li {
  display: inline-block;
  position: relative;
}
#main_menu li a{
  display: block;
  padding: 12px 15px;
  color: #000;
  text-decoration: none;
}
#main_menu li a:hover{
  background:  #3ae374;
}

/* dropdown menu */

#main_menu ul ul{
  position: absolute;
  left: 0;
  top: 43px;
  background: darkkhaki;
  width: 145px;
  display: none;
  z-index: 999;
}
#main_menu ul ul li {
  display: block;
}
#main_menu ul li:hover ul{
  display: block;
}
#main_menu ul li:hover a{
  background: #82ccdd;
}
#main_menu ul li:hover li a{
  background: #4b4b4b;
}
#main_menu ul ul li a{
  color: white;
}
#main_menu ul ul li a:hover {
  background: #a55eea;
}

</style>
<body>
  <nav id="main_menu">
    <ul>
      <li><a href="">Home</a></li>
      <li><a href="">Portfolio</a></li>
      <li><a href="">Service</a>
        <ul>
          <li><a href="#">Web Design</a></li>
          <li><a href="#">SEO Optimization</a></li>
          <li><a href="#">Digital Marketing</a></li>
          <li><a href="#">Graphic Design</a></li>
      </ul>
      </li>
      <li><a href="">Testimonial</a></li>
      <li><a href="">About</a></li>
      <li><a href="">Blog</a></li>
      <li><a href="">Contact Us</a></li>
    </ul>
  </nav>
     


</body>
</html>
