<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

</head>
<style>
  :root{
    --primary: tomato;
    --sec: blue;
  }
.one{
  background: var(--primary);
  width: 150px;
  height: 100px;
  border: 2px solid black;
  margin: 50px 50px 0px;
  transform: 3s;
  animation-name: css;
  animation-duration: 7s;
  animation-delay: 3s;
  animation-iteration-count: 3;
}
/* animation */
@keyframes css{
  from {
    background: blue;
    width: 100px;
    height: 100px;
  }
  to {
    background: red;
    width: 400px;
    height: 400px;
  }
}
@keyframes css{
  0% {
    background: blue;
    width: 100px;
    height: 100px;
  }
  50% {
    background: red;
    width: 400px;
    height: 400px;
  }
  100% {
    background: green;
    width: 200px;
    height: 200px;
  }
}
two{
  background: orange;
  width: 100px;
  height: 100px;
  border: 2px solid black;
  border-radius: 50%;
  margin: 30px;
  position: relative;
  animation-name: gol;
  animation-duration: 4s;
  animation-iteration-count: infinite ;
  animation-timing-function: ease-in-out;
}
@keyframes gol{
  0%{
    top: 0;
    left: 0;
  }
  20%{
    top: 300px;
    left: auto;
    right: 0;
  }
  40%{
    top: 300px;
    left: 300px;
    right: 0;
    bottom: 0;
  }
  75%{
    top: 300px;
    left: 0;
  }
  100%{
    top: 0;
    left: 0;
  }
}
/* .one:hover{
  transform: rotate(100deg)
} */
</style>
<body>
   
  <div class="one">

  </div>

  <div class="two">

  </div>



</body>
</html>
