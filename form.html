<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>forms</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

</head>
<style>
  body{
    margin: 0;
    padding: 0;
    font-family: 'popins', sans-serif;
    background: #576574;
  }
.contact{
  width: 80%;
  border: 1px solid #ddd;
  margin: 20px auto;
  padding: 5%;
  text-align: center;
  box-sizing: border-box;
  box-shadow: rgba(238, 82, 83,4.0);
  background: #f4f4f4;
}
.contact h2{
  font-weight: bold;
  font-size: 30px;
  margin-bottom: 0px;
}
.contact p{
  color: black
}
.contact form{
  margin-top: 25px;
}
.child{
  width: 100%;
  margin-bottom: 15px;
  text-align: left;
}
.child label{
  margin-bottom: 10px;
  display: block;
  font-weight: bold;
  font-size: 18px;
}
.child input, textarea{
 border: 2px solid #ccc; 
 width: 70%;
 padding: 10px 3%;
 border-radius: 5px;
 font-family: 'popins', sans-serif;
 font-size: 14px;
}
.child:last-child{
  margin-bottom: 0px;
}
.child:nth-child(4) textarea {
  margin-top: -10px;
}
/* .child input[type='button']{ */
#btn{
  width: 220px;
  font-weight: bold;
  background: blueviolet;
  border: 1px solid blueviolet;
  color: #fff;
  cursor: pointer;
  transition: 0.3s;
}
/* .child input[type='button']:hover{ */
#btn:hover{
     background: orchid;
     transform: scale(1.2);
}
.ctg{
   display: flex;
   gap: 5px;
   width: 90%;
}
.ctg select{
 width: 8%;
 border: 2px solid #000; 
 border-radius: 5px;
 font-family: 'popins', sans-serif;
 font-size: 14px;
}
</style>
<body>
  <div class="contact">
    <h2>Level up your brand</h2>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. At, consequatur!</p>
    <form action="">
    <div class="child">
      <label for="name">Name</label>
      <input type="text" name="name" id="name" placeholder="your name" required>
    </div>
    <div class="child">
      <label for="email">Email</label>
      <input type="email" name="email" id="email" placeholder="your email" required>
    </div>
    <div class="child">
      <label for="phone">Phone</label>
      <div class="ctg">
      <select id="country-code" name="country-code">
        <option value="+1">+1 (USA)</option>
        <option value="+44">+44 (UK)</option>
        <option value="+91">+91 (India)</option>
        <option value="+880">+880 (Bangladesh)</option>
        <option value="+61">+61 (Australia)</option>
    </select>
    <input type="number" name="phone" id="phone" placeholder="your Number" required>
  </div>
    </div>
    <!-- <div class="child">
      <label for="phone">Enter your Number</label>
      <input type="number" name="phone" id="phone" placeholder="your Number" required>
    </div> -->
    <div class="child">
      <label for="message">How can we help?</label><br>
      <textarea name="message" id="message" rows="10" cols="10" placeholder="your message"></textarea>
    </div>
    <div class="child">
      <input id="btn" type="button" value="send message">
    </div>
    </form>
  </div>

</body>
</html>
